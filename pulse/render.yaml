# Render blueprint: a web service from the Dockerfile plus a free Postgres database.
# Render > New > Blueprint > pick this repo. Then add your API key in the dashboard.
services:
  - type: web
    name: pulse
    runtime: docker
    rootDir: pulse
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: pulse-db, property: connectionString }
      - key: PULSE_PROVIDER
        value: anthropic            # or openai / gemini, or remove for the built-in parser
      - key: ANTHROPIC_API_KEY
        sync: false                 # you enter this in the dashboard; it is never committed
      - key: PULSE_ENCRYPTION_KEYS
        sync: false                 # REQUIRED for "bring your own key". Generate: python -m app.crypto
databases:
  - name: pulse-db
    plan: free
