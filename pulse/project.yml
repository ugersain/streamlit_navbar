name: Pulse
options:
  bundleIdPrefix: com.example.pulse   # change to your own reverse-DNS prefix
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""              # set your Apple Developer team id to run on a device
configFiles:
  Debug: apple/Config.xcconfig
  Release: apple/Config.xcconfig

targets:
  Pulse:
    type: application
    platform: iOS
    sources:
      - apple/Shared
      - apple/PulseiOS
      - path: shared/foods.json
        buildPhase: resources
    dependencies:
      - target: PulseWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pulse
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: apple/PulseiOS/Info.plist
      properties:
        CFBundleDisplayName: Pulse
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Pulse listens when you log food or ask a question by voice.
        NSSpeechRecognitionUsageDescription: Pulse turns what you say into text so it can log meals and answer questions.
        NSHealthShareUsageDescription: Pulse reads your activity and workouts to show your progress.
        NSHealthUpdateUsageDescription: Pulse saves your finished workouts to Apple Health.
        PULSE_API_URL: $(PULSE_API_URL)
    entitlements:
      path: apple/PulseiOS/Pulse.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []

  PulseWatch:
    type: application
    platform: watchOS
    sources:
      - apple/Shared
      - apple/PulseWatch
      - path: shared/foods.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pulse.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
    info:
      path: apple/PulseWatch/Info.plist
      properties:
        CFBundleDisplayName: Pulse
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.example.pulse
        NSHealthShareUsageDescription: Pulse reads your heart rate and activity during workouts.
        NSHealthUpdateUsageDescription: Pulse saves your finished workouts to Apple Health.
        PULSE_API_URL: $(PULSE_API_URL)
    entitlements:
      path: apple/PulseWatch/PulseWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []

  PulseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: apple/Tests
        excludes: ["Fixtures/**"]
      - path: apple/Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Pulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pulse.tests
        GENERATE_INFOPLIST_FILE: YES
