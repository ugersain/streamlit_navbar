name: Pulse

on:
  push:
    paths: ["pulse/**", ".github/workflows/pulse.yml"]
  pull_request:
    paths: ["pulse/**", ".github/workflows/pulse.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulse/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  web:
    # Drives the real web app in a browser: sign-up, onboarding, every screen and function.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pulse/backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Start the server
        working-directory: pulse/backend
        run: |
          export DATABASE_URL=sqlite:////tmp/e2e.db PULSE_ENV=test PULSE_FAKE_PROVIDER_URL=http://127.0.0.1:9911
          export PULSE_ENCRYPTION_KEYS=$(python -m app.crypto)
          nohup python -m uvicorn app.main:app --port 8000 > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/healthz && break; sleep 1; done
      - name: Run the browser tests
        working-directory: pulse/web
        run: NODE_PATH=$GITHUB_WORKSPACE/node_modules node e2e/e2e.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: /tmp/pulse-shots

  apple:
    # Xcode only runs on macOS, so the Watch and iPhone apps are compiled and tested here.
    runs-on: macos-15
    defaults:
      run:
        working-directory: pulse
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: xcodegen generate
      - name: Build the Apple Watch app (simulator)
        run: |
          xcodebuild build -project Pulse.xcodeproj -scheme PulseWatch \
            -destination 'generic/platform=watchOS Simulator' CODE_SIGNING_ALLOWED=NO
      - name: Build and test the iPhone app (with the Watch app embedded)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          xcodebuild test -project Pulse.xcodeproj -scheme Pulse \
            -destination "id=$UDID" CODE_SIGNING_ALLOWED=NO
